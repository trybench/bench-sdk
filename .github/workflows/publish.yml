# Publishes one SDK package per release tag through registry trusted publishing
# (OIDC), so no registry token is stored in this repository:
#   js/vX.Y.Z      -> npm       @benchai/sdk
#   python/vX.Y.Z  -> PyPI      trybench-sdk
#   rust/vX.Y.Z    -> crates.io trybench-sdk
#   go/vX.Y.Z      -> nothing to publish; the Go proxy serves the tag itself.
# Each registry must have this repository and workflow configured as a trusted
# publisher for the package before its job can succeed. See PUBLISHING.md.
name: Publish

on:
  push:
    tags: ['js/v*', 'python/v*', 'rust/v*']

permissions:
  id-token: write # required for OIDC
  contents: read

jobs:
  npm:
    if: startsWith(github.ref_name, 'js/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs npm >= 11.5.1, which Node 24 ships with.
          node-version: '24'
          # registry-url is required: npm only attempts the trusted-publishing
          # OIDC exchange for a registry it has auth configuration for.
          registry-url: 'https://registry.npmjs.org'
      - name: Use an npm new enough for trusted publishing
        run: npm install -g npm@^11 && npm --version
      - run: npm ci
      - run: npm test
      - name: Check the tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#js/v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi
      - run: npm publish --access public --provenance

  pypi:
    if: startsWith(github.ref_name, 'python/v')
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check the tag matches pyproject.toml
        run: |
          TAG="${GITHUB_REF_NAME#python/v}"
          PKG="$(python3 -c 'import tomllib;print(tomllib.load(open("python/pyproject.toml","rb"))["project"]["version"])')"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject version $PKG"
            exit 1
          fi
      - run: python -m pip install build
      - run: python -m unittest discover -s tests
        working-directory: python
        env:
          PYTHONPATH: src
      - run: python -m build
        working-directory: python
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist

  crates:
    if: startsWith(github.ref_name, 'rust/v')
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - name: Check the tag matches Cargo.toml
        run: |
          TAG="${GITHUB_REF_NAME#rust/v}"
          PKG="$(grep -m1 '^version' rust/Cargo.toml | sed 's/.*"\(.*\)"/\1/')"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $PKG"
            exit 1
          fi
      - run: cargo test --locked
        working-directory: rust
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish --locked
        working-directory: rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
